# Cloudflare Pages Deployment Configuration
# This configuration is optimized for static site hosting with Vite

build:
  command: pnpm run deploy:morphdrawer
  cwd: ./
  
publish: artifacts/morphdrawer/dist

# Environment variables for production builds
environment:
  production:
    vars:
      VITE_API_URL: https://api.example.com

# Headers for PWA support
headers:
  - path: /sw.js
    headers:
      - key: Cache-Control
        value: "public, max-age=0, must-revalidate"
  - path: /manifest.json
    headers:
      - key: Content-Type
        value: "application/manifest+json"
  - path: "*.js"
    headers:
      - key: Cache-Control
        value: "public, max-age=31536000, immutable"
  - path: "*.css"
    headers:
      - key: Cache-Control
        value: "public, max-age=31536000, immutable"
  - path: "*.woff2"
    headers:
      - key: Cache-Control
        value: "public, max-age=31536000, immutable"
      - key: Content-Type
        value: "font/woff2"

# Redirects for SPA routing (required for client-side routing)
redirects:
  - from: /404.html
    to: /index.html
    status: 404
